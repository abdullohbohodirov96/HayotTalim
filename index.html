    <h1>Sabo Academy — xorijiy tillar markazi</h1>
    <p>Alifbodan erkin suhbatgacha. Ayollar, erkaklar va bolalar uchun alohida guruhlar.
      Darslarni ona tili arab tili bo‘lgan ustozlar olib boradi — siz birinchi
      kundan arabcha gapira boshlaysiz.</p>
    <h2>Darajalar</h2>
    <ul>
      <li>A1 — Boshlang‘ich: harflar, salomlashish, oddiy jumlalar</li>
      <li>A2 — Elementar: kundalik suhbat va asosiy grammatika</li>
      <li>B1 — O‘rta: suhbat, matn o‘qish, fe’l shakllari</li>
      <li>B2 — O‘rtadan yuqori: erkin suhbat va matn tahlili</li>
      <li>C1 — Yuqori: ilmiy matn, nozik ma’no farqlari</li>
      <li>C2 — Mukammal: adabiy matn, balog‘at va sarf-nahv</li>
    </ul>
    <h2>Markaz haqida</h2>
    <ul>
      <li>Ayollar, erkaklar va bolalar uchun alohida guruhlar, daraja bo‘yicha</li>
      <li>Ayollar va erkaklar uchun alohida guruhlar</li>
      <li>Kichik guruhlar — har bir o‘quvchiga shaxsiy e’tibor</li>
      <li>Ertalabki, kunduzgi va kechki smenalar</li>
      <li>Bepul daraja aniqlash testi — 20 ta savol, 10 daqiqa</li>
    </ul>
    <p>Manzil: Toshkent. Aloqa uchun saytdagi telefon raqamiga qo‘ng‘iroq
      qiling yoki ariza qoldiring. Sahifa to‘liq ishlashi uchun brauzerda
      JavaScript yoqilgan bo‘lishi kerak.</p>

<noscript><main id="seo-prerender" style="max-width:860px;margin:24px auto;padding:28px;font:16px/1.6 system-ui,sans-serif;color:#0f4a40;background:#fff;border-radius:18px"><h1>Sabo Academy — arab tili kurslari</h1><p><strong>Sabo Academy</strong> — xorijiy tillar markazi. Arab tilini noldan boshlab 1 yilda o‘rganing: tajribali ustozlar bilan jonli darslar (onlayn Zoom va offline), haftada 3 marta, har biri 80 daqiqa. Ayollar, erkaklar va bolalar uchun alohida kichik guruhlar (10 kishigacha). Har bir dars yozib olinadi.</p><h2>Arab tili kursi: A1 dan C2 gacha</h2><ul><li>1-oy: harflar va o‘qish</li><li>3-oy: ravon o‘qish va to‘g‘ri talaffuz</li><li>6-oy: ma’noni tushunish, asosiy grammatika</li><li>12-oy: arabcha gaplashish (A2–B1)</li></ul><h2>Tekin dars va bepul daraja testi</h2><p>Birinchi dars — tekin. Raqamingizni qoldiring yoki qo‘ng‘iroq qiling. Darajangizni saytdagi bepul test bilan 10 daqiqada aniqlang.</p><h2>Ko‘p so‘raladigan savollar</h2><h3>Arab tilini noldan o‘rgansam bo‘ladimi?</h3><p>Ha. Darslar alifbodan boshlanadi: harflar, o‘qish, keyin grammatika va suhbat. Noldan boshlab 1 yilda arabcha matnni tushunib o‘qish va kundalik suhbat darajasiga yetasiz.</p><h3>Darslar onlaynmi yoki offlaynmi?</h3><p>Ikkalasi ham bor. Onlayn darslar Zoom orqali jonli o‘tadi — O‘zbekistonning istalgan joyidan va chet eldan qatnashish mumkin.</p><h3>Darslar qanchalik tez-tez bo‘ladi?</h3><p>Haftada 3 marta, har bir dars 80 daqiqa. Ertalabki, kunduzgi va kechki vaqtlardan qulayini tanlaysiz.</p><h3>Guruhlar qanday tuzilgan?</h3><p>Ayollar, erkaklar va bolalar uchun alohida guruhlar. Guruhda 10 kishigacha — ustoz har bir o‘quvchiga vaqt ajratadi.</p><h3>Darsni qoldirib ketsam nima bo‘ladi?</h3><p>Har bir dars yozib olinadi. Yozuv, uy vazifasi va ustoz izohlari shaxsiy kabinetingizda turadi — ortda qolmaysiz.</p><h3>Darajamni qanday bilaman?</h3><p>Saytdagi bepul daraja testini topshiring: 20 ta savol, 10 daqiqa. Natijaga qarab sizga mos guruh tavsiya qilinadi.</p><h3>Tekin dars qanday o‘tadi?</h3><p>“Tekin darsga yozilish” tugmasini bosing va raqamingizni qoldiring. Administratorimiz bog‘lanadi va jonli ochiq dars havolasini yuboradi.</p><h2>Bog‘lanish</h2><p>Telefon: <a href="tel:+998509999733">+998 50 999 97 33</a></p><p><a href="https://www.instagram.com/sabo.academy/">Instagram — sabo.academy</a></p><p><a href="https://t.me/SaboAcademy">Telegram kanal — SaboAcademy</a></p><p><a href="https://www.facebook.com/profile.php?id=61595261428849">Facebook — Sabo Academy</a></p></main></noscript>
