    <h1>Arab tili markazi — ayollar uchun onlayn arab tili</h1>
    <p>Alifbodan erkin suhbatgacha. Ayollar va erkaklar uchun alohida guruhlar.
      Darslarni ona tili arab tili bo‘lgan ustozlar olib boradi — siz birinchi
      kundan arabcha gapira boshlaysiz.</p>
    <h2>Darajalar</h2>
    <ul>
      <li>A1 — Boshlang‘ich: harflar, salomlashish, oddiy jumlalar</li>
      <li>A2 — Elementar: kundalik suhbat va asosiy grammatika</li>
      <li>B1 — O‘rta: suhbat, matn o‘qish, fe’l shakllari</li>
      <li>B2 — O‘rtadan yuqori: erkin suhbat va matn tahlili</li>
      <li>C1 — Yuqori: ilmiy matn, nozik ma’no farqlari</li>
      <li>C2 — Mukammal: adabiy matn, balog‘at va sarf-nahv</li>
    </ul>
    <h2>Markaz haqida</h2>
    <ul>
      <li>Guruhlar faqat daraja bilan farq qiladi, narx hamma darajada bir xil</li>
      <li>Ayollar va erkaklar uchun alohida guruhlar</li>
      <li>Kichik guruhlar — har bir o‘quvchiga shaxsiy e’tibor</li>
      <li>Ertalabki, kunduzgi va kechki smenalar</li>
      <li>Bepul daraja aniqlash testi — 20 ta savol, 10 daqiqa</li>
    </ul>
    <p>Manzil: Toshkent. Aloqa uchun saytdagi telefon raqamiga qo‘ng‘iroq
      qiling yoki ariza qoldiring. Sahifa to‘liq ishlashi uchun brauzerda
      JavaScript yoqilgan bo‘lishi kerak.</p>
  </div>
</noscript>
