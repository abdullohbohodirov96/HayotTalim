<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Qissa videodarsi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Manrope:wght@500;700;800&display=swap">
<link rel="stylesheet" href="css/app.css">
<style>
  html,body{margin:0;background:#0f4a40;font-family:Manrope,system-ui,sans-serif}
  .wrap{max-width:1100px;margin:0 auto;padding:20px 16px}
  .wrap h1{color:#fff;font-size:20px;margin:0 0 12px}
  body.render .wrap{max-width:none;padding:0}
  body.render .wrap h1{display:none}
  body.render .qv{margin:0}
</style>
</head>
<body>
<div class="wrap"><h1 id="t"></h1><div id="player"></div></div>
<script src="js/speak.js"></script>
<script src="js/course-a1.js"></script>
<script src="js/qissa-video.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var L = A.Course.byId(q.get('l') || 'a1-01') || A.Course.LESSONS[0];
  var render = q.get('render') === '1';
  if (render) document.body.classList.add('render');
  document.getElementById('t').textContent = L.n + '-dars · ' + L.title + ' — qissa videosi';
  var audioBase = q.get('audio');          // masalan: assets/audio/a1-01 → a1-01-0.mp3, a1-01-1.mp3 ...
  var api = A.QissaVideo.mount(document.getElementById('player'), L, {
    render: render,
    audioUrl: audioBase ? function (i) { return audioBase + '-' + i + '.mp3'; } : null
  });
  window.QV_RENDER = function (timing) { return api.renderRun(timing); };
})();
</script>
</body>
</html>
