# Render.com — NAMOYISH (demo) versiyasi: bepul "Static Site".
# Baza kerak emas: barcha ma'lumotlar (o'quvchilar, guruhlar, to'lovlar,
# darslar) namuna sifatida brauzerda yaratiladi.
# Haqiqiy serverli versiya sozlamasi: render-server.yaml
services:
  - type: web
    name: hayot-talim-demo
    runtime: static
    buildCommand: node build.js && node scripts/build-vercel.js
    staticPublishPath: vercel-dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Google Analytics — "Hayot Ta'lim — hayottalim.uz" resursi
      - key: GA_MEASUREMENT_ID
        value: G-HQWL42X43Y
    routes:
      - type: redirect
        source: /kabinet
        destination: /#kabinet
      - type: redirect
        source: /kurs
        destination: /#kurs
